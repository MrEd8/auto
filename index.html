<!DOCTYPE html>
<html lang="cs" class="bg-black dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AutoAsistent" />
  <meta name="theme-color" content="#000000" />
  <title>AutoAsistent</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            iosBg: '#000000',
            iosCard: '#1C1C1E',
            iosElevated: '#2C2C2E',
            iosSeparator: '#38383A',
            iosBlue: '#0A84FF',
            iosGreen: '#30D158',
            iosOrange: '#FF9F0A',
            iosRed: '#FF453A',
            iosGray: '#8E8E93',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Dynamická Apple Touch ikona pro plochu iPhonu -->
  <script>
    (function() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 180;
        canvas.height = 180;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#111113';
        ctx.fillRect(0, 0, 180, 180);
        const grad = ctx.createLinearGradient(0, 0, 180, 180);
        grad.addColorStop(0, '#0A84FF');
        grad.addColorStop(1, '#0055D4');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(24, 24, 132, 132, 32);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 64px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('A', 90, 94);
        const link = document.createElement('link');
        link.rel = 'apple-touch-icon';
        link.href = canvas.toDataURL('image/png');
        document.head.appendChild(link);
      } catch (e) {}
    })();
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    html, body {
      background-color: #000000;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
      overscroll-behavior-y: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    }
    .safe-top {
      padding-top: max(env(safe-area-inset-top), 14px);
    }
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 12px);
    }
    .content-bottom-pad {
      padding-bottom: calc(max(env(safe-area-inset-bottom), 12px) + 84px);
    }
    /* Custom scrollbar hide */
    ::-webkit-scrollbar {
      display: none;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: 0.7;
    }
  </style>
</head>
<body class="bg-black text-white antialiased selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Ikony (Apple SF Symbols styl) ---
    const Icons = {
      Dashboard: ({ active }) => (
        <svg className="w-6 h-6" fill={active ? "currentColor" : "none"} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={active ? 1.8 : 1.7}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      ),
      CarDocs: ({ active }) => (
        <svg className="w-6 h-6" fill={active ? "currentColor" : "none"} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={active ? 1.8 : 1.7}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      ),
      Wrench: ({ active }) => (
        <svg className="w-6 h-6" fill={active ? "currentColor" : "none"} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={active ? 1.8 : 1.7}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      ),
      ChevronDown: () => (
        <svg className="w-4 h-4 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      ),
      Settings: () => (
        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
        </svg>
      ),
      Calendar: () => (
        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      ),
      Copy: () => (
        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
      ),
      Check: () => (
        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      ),
      Phone: () => (
        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
      ),
      Plus: () => (
        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      ),
      Edit: () => (
        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
        </svg>
      ),
      Trash: () => (
        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      Swap: () => (
        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
        </svg>
      ),
      Close: () => (
        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      )
    };

    // --- Pomocné funkce ---
    const STORAGE_KEY = 'autoasistent_garage_v1';

    const todayISO = () => new Date().toISOString().split('T')[0];

    const addMonthsISO = (months) => {
      const d = new Date();
      d.setMonth(d.getMonth() + months);
      return d.toISOString().split('T')[0];
    };

    const daysBetween = (dateStr1, dateStr2) => {
      if (!dateStr1 || !dateStr2) return null;
      const d1 = new Date(dateStr1 + 'T00:00:00');
      const d2 = new Date(dateStr2 + 'T00:00:00');
      return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
    };

    const formatDateCZ = (dateStr) => {
      if (!dateStr) return 'Nenastaveno';
      const [y, m, d] = dateStr.split('-');
      return `${parseInt(d, 10)}. ${parseInt(m, 10)}. ${y}`;
    };

    const formatRelativeDays = (dateStr) => {
      if (!dateStr) return 'Nikdy';
      const diff = daysBetween(dateStr, todayISO());
      if (diff === 0) return 'Dnes';
      if (diff === 1) return 'Včera';
      if (diff < 0) return 'Dnes';
      return `Před ${diff} dny`;
    };

    const formatNumber = (num) => {
      if (num === null || num === undefined || isNaN(num)) return '0';
      return Number(num).toLocaleString('cs-CZ');
    };

    const createDefaultCar = (name = 'Moje Auto', subtitle = '2.0 TDI • 110 kW', spz = '1AB 2345') => {
      const today = todayISO();
      const currentYear = new Date().getFullYear();
      return {
        id: 'car_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name,
        subtitle,
        odometer: 124500,
        odometerUpdatedAt: today,
        oil: {
          lastKm: 118200,
          lastDate: addMonthsISO(-6),
          intervalKm: 15000,
          intervalDays: 365
        },
        tires: {
          active: 'summer', // 'summer' | 'winter'
          summer: {
            size: '225/45 R17 91Y',
            brand: 'Michelin Primacy 4',
            dotYear: currentYear - 2
          },
          winter: {
            size: '205/55 R16 91H',
            brand: 'Continental WinterContact TS 870',
            dotYear: currentYear - 3
          }
        },
        tech: {
          vin: 'TMBJJ7NE5K0123456',
          spz,
          oilSpec: '5W-30 (VW 504.00 / 507.00)',
          tirePressure: '2.4 bar předek / 2.3 bar zadek',
          wipers: '650 mm řidič / 450 mm spolujezdec',
          assistancePhone: '+420 1224'
        },
        admin: [
          { id: 'stk', title: 'Technická kontrola (STK)', date: addMonthsISO(14) },
          { id: 'vignette', title: 'Dálniční známka ČR', date: addMonthsISO(4) },
          { id: 'pov', title: 'Povinné ručení', date: addMonthsISO(7) },
          { id: 'hav', title: 'Havarijní pojištění', date: addMonthsISO(7) },
          { id: 'firstaid', title: 'Autolékárnička', date: addMonthsISO(18) }
        ],
        components: {
          battery: {
            installDate: addMonthsISO(-30),
            lifespanYears: 5
          },
          timingBelt: {
            lastDate: addMonthsISO(-24),
            lastKm: 95000,
            intervalKm: 150000,
            intervalYears: 6
          }
        },
        plannedTasks: [
          { id: 'pt_1', title: 'Kontrola a doplnění klimatizace', note: 'Před létem nechat vyčistit ozónem' }
        ],
        serviceArchive: [
          {
            id: 'sa_1',
            date: addMonthsISO(-6),
            title: 'Výměna motorového oleje a filtrů',
            km: 118200,
            price: 3850,
            note: 'Olej Castrol Edge 5W-30 LL + olejový a kabinový filtr Mann'
          }
        ]
      };
    };

    // Generování .ics události pro Apple Kalendář
    const downloadICS = (title, dateStr, carName) => {
      if (!dateStr) return;
      const cleanDate = dateStr.replace(/-/g, '');
      // Následující den pro celodenní událost v iCalendar formátu
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + 1);
      const nextDate = d.toISOString().split('T')[0].replace(/-/g, '');
      const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

      const icsLines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//AutoAsistent//CZ//EN',
        'BEGIN:VEVENT',
        `UID:autoasistent-${Date.now()}@local`,
        `DTSTAMP:${stamp}`,
        `DTSTART;VALUE=DATE:${cleanDate}`,
        `DTEND;VALUE=DATE:${nextDate}`,
        `SUMMARY:${title} (${carName})`,
        `DESCRIPTION:Připomínka z aplikace AutoAsistent pro vůz ${carName}.`,
        'BEGIN:VALARM',
        'TRIGGER:-P14D',
        'ACTION:DISPLAY',
        `DESCRIPTION:Za 14 dní: ${title} (${carName})`,
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('
');

      const blob = new Blob([icsLines], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title.toLowerCase().replace(/[^a-z0-9]/gi, '-')}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    // --- Komponenta pro Modální okno v iOS stylu ---
    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm animate-fadeIn" onClick={onClose}>
          <div
            className="w-full max-w-md bg-[#1C1C1E] border-t sm:border border-[#38383A] rounded-t-3xl sm:rounded-3xl p-5 safe-bottom shadow-2xl max-h-[90vh] overflow-y-auto"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="w-10 h-1 bg-[#48484A] rounded-full mx-auto mb-4 sm:hidden" />
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-semibold tracking-tight text-white">{title}</h3>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-[#2C2C2E] flex items-center justify-center text-[#8E8E93] active:scale-95 transition"
              >
                <Icons.Close />
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    };

    // --- Hlavní Aplikace ---
    function App() {
      const [cars, setCars] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.cars) && parsed.cars.length > 0) {
              return parsed.cars;
            }
          }
        } catch (e) {}
        return [createDefaultCar('Škoda Octavia', '2.0 TDI • Combi', '4A2 8890')];
      });

      const [activeCarId, setActiveCarId] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.activeCarId) return parsed.activeCarId;
          }
        } catch (e) {}
        return null;
      });

      const [activeTab, setActiveTab] = useState('overview'); // 'overview' | 'docs' | 'service'
      const [toast, setToast] = useState(null);

      // Modály
      const [modal, setModal] = useState(null);
      // Možné hodnoty modal:
      // { type: 'garage' }
      // { type: 'addCar' }
      // { type: 'odometer' }
      // { type: 'oilChange' }
      // { type: 'oilSettings' }
      // { type: 'editTech' }
      // { type: 'editTire', season: 'summer' | 'winter' }
      // { type: 'editAdmin', item: {...} }
      // { type: 'editBattery' }
      // { type: 'editTimingBelt' }
      // { type: 'addPlanned' }
      // { type: 'completePlanned', task: {...} }
      // { type: 'addArchive' }
      // { type: 'settings' }

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2400);
      };

      const currentCar = useMemo(() => {
        return cars.find(c => c.id === activeCarId) || cars[0];
      }, [cars, activeCarId]);

      useEffect(() => {
        if (!activeCarId && cars.length > 0) {
          setActiveCarId(cars[0].id);
        }
      }, [cars, activeCarId]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            cars,
            activeCarId: currentCar?.id
          }));
        } catch (e) {
          console.error('Chyba ukládání do localStorage', e);
        }
      }, [cars, currentCar]);

      const updateCurrentCar = (updater) => {
        setCars(prev => prev.map(car => {
          if (car.id !== currentCar.id) return car;
          return typeof updater === 'function' ? updater(car) : { ...car, ...updater };
        }));
      };

      // --- Výpočty stavů a Semaforu ---
      const statusData = useMemo(() => {
        if (!currentCar) return { alerts: [], oil: {}, battery: {}, timing: {} };
        const today = todayISO();
        const currentYear = new Date().getFullYear();
        const alerts = [];

        // 1. Olej (15 000 km nebo 365 dní)
        const kmUsed = Math.max(0, currentCar.odometer - currentCar.oil.lastKm);
        const kmLeft = currentCar.oil.intervalKm - kmUsed;
        const kmPct = Math.min(100, Math.max(0, (kmUsed / currentCar.oil.intervalKm) * 100));

        const daysUsed = Math.max(0, daysBetween(currentCar.oil.lastDate, today) || 0);
        const daysLeft = currentCar.oil.intervalDays - daysUsed;
        const daysPct = Math.min(100, Math.max(0, (daysUsed / currentCar.oil.intervalDays) * 100));

        let oilStatus = 'green';
        if (kmLeft <= 0 || daysLeft <= 0) oilStatus = 'red';
        else if (kmLeft <= 1500 || daysLeft <= 30) oilStatus = 'orange';

        if (oilStatus === 'red') {
          alerts.push({
            level: 'red',
            text: kmLeft <= 0
              ? `Výměna oleje přesluhuje o ${formatNumber(Math.abs(kmLeft))} km`
              : `Výměna oleje přesluhuje o ${Math.abs(daysLeft)} dní`
          });
        } else if (oilStatus === 'orange') {
          alerts.push({
            level: 'orange',
            text: `Blíží se výměna oleje (zbývá ${formatNumber(Math.max(0, kmLeft))} km / ${Math.max(0, daysLeft)} dní)`
          });
        }

        // 2. Pneumatiky (stáří DOT >= 5 let)
        const summerAge = currentYear - Number(currentCar.tires.summer.dotYear || currentYear);
        const winterAge = currentYear - Number(currentCar.tires.winter.dotYear || currentYear);
        if (summerAge >= 5) {
          alerts.push({ level: 'orange', text: `Letní pneu jsou staré ${summerAge} let (DOT ${currentCar.tires.summer.dotYear})` });
        }
        if (winterAge >= 5) {
          alerts.push({ level: 'orange', text: `Zimní pneu jsou staré ${winterAge} let (DOT ${currentCar.tires.winter.dotYear})` });
        }

        // 3. Administrativa
        currentCar.admin.forEach(item => {
          if (!item.date) return;
          const left = daysBetween(today, item.date);
          if (left < 0) {
            alerts.push({ level: 'red', text: `${item.title} vypršela před ${Math.abs(left)} dny` });
          } else if (left <= 30) {
            alerts.push({ level: 'orange', text: `${item.title} končí za ${left} dní` });
          }
        });

        // 4. Autobaterie (životnost 5 let)
        const batDaysUsed = Math.max(0, daysBetween(currentCar.components.battery.installDate, today) || 0);
        const batTotalDays = (currentCar.components.battery.lifespanYears || 5) * 365;
        const batDaysLeft = batTotalDays - batDaysUsed;
        const batPct = Math.min(100, Math.max(0, (batDaysUsed / batTotalDays) * 100));
        const batYears = (batDaysUsed / 365).toFixed(1).replace('.', ',');
        if (batDaysLeft <= 0) {
          alerts.push({ level: 'orange', text: `Autobaterie je stará ${batYears} let – doporučena kontrola` });
        }

        // 5. Rozvody
        const tb = currentCar.components.timingBelt;
        const tbKmUsed = Math.max(0, currentCar.odometer - tb.lastKm);
        const tbKmLeft = tb.intervalKm - tbKmUsed;
        const tbDaysUsed = Math.max(0, daysBetween(tb.lastDate, today) || 0);
        const tbDaysTotal = (tb.intervalYears || 6) * 365;
        const tbDaysLeft = tbDaysTotal - tbDaysUsed;
        const tbPct = Math.min(100, Math.max(0, Math.max(tbKmUsed / tb.intervalKm, tbDaysUsed / tbDaysTotal) * 100));

        if (tbKmLeft <= 0 || tbDaysLeft <= 0) {
          alerts.push({ level: 'red', text: 'Rozvody dosáhly limitu výměny!' });
        } else if (tbKmLeft <= 10000 || tbDaysLeft <= 90) {
          alerts.push({ level: 'orange', text: `Blíží se výměna rozvodů (zbývá ${formatNumber(Math.max(0, tbKmLeft))} km)` });
        }

        return {
          alerts,
          oil: { kmUsed, kmLeft, kmPct, daysUsed, daysLeft, daysPct, status: oilStatus },
          battery: { batDaysLeft, batPct, batYears },

      // --- Export / Import Zálohy ---
      const handleExportJSON = () => {
        const dataStr = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), cars, activeCarId: currentCar.id }, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `autoasistent-zaloha-${todayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('Záloha stažena');
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (Array.isArray(parsed.cars) && parsed.cars.length > 0) {
              setCars(parsed.cars);
              setActiveCarId(parsed.activeCarId || parsed.cars[0].id);
              setModal(null);
              showToast('Záloha úspěšně obnovena');
            } else {
              showToast('Neplatný formát souboru');
            }
          } catch (err) {
            showToast('Chyba při čtení souboru');
          }
        };
        reader.readAsText(file);
      };

      const copyToClipboard = (text, label) => {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(`${label} zkopírováno`));
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast(`${label} zkopírováno`);
        }

                    <div className="bg-[#1C1C1E] rounded-2xl p-3.5 border border-[#2C2C2E] space-y-2">
                      <div className="flex items-center justify-between">
                        <div>
                          <div className="text-sm font-semibold text-white">Rozvody motoru</div>
                          <div className="text-xs text-[#8E8E93]">
                            Měněny {formatDateCZ(currentCar.components.timingBelt.lastDate)} při {formatNumber(currentCar.components.timingBelt.lastKm)} km
                          </div>
                        </div>
                        <button
                          onClick={() => setModal({ type: 'editTimingBelt' })}
                          className="p-2 rounded-xl bg-[#2C2C2E] text-[#8E8E93] hover:text-white"
                        >
                          <Icons.Edit />
                        </button>
                      </div>
                      <div className="flex justify-between text-xs text-[#8E8E93]">
                        <span>Limit: {formatNumber(currentCar.components.timingBelt.intervalKm)} km / {currentCar.components.timingBelt.intervalYears} let</span>
                        <span className="text-white font-medium">
                          Zbývá {formatNumber(Math.max(0, statusData.timing.tbKmLeft))} km

                      </div>
                      <div className="w-full h-1.5 bg-[#2C2C2E] rounded-full overflow-hidden">
                        <div
                          className={`h-full rounded-full ${statusData.timing.tbKmLeft <= 0 ? 'bg-[#FF453A]' : 'bg-[#0A84FF]'}`}

                    </div>
                  </div>
                </section>
              </>
            )}

            {/* ==================== ZÁLOŽKA 3: SERVISNÍ DENÍK ==================== */}
            {activeTab === 'service' && (
              <>
                {/* Plánované úkoly (Čeká mě) */}
                <section className="space-y-2">
                  <div className="flex items-center justify-between px-1">
                    <h2 className="text-xs font-semibold uppercase tracking-wider text-[#8E8E93]">
                      Čeká mě ({currentCar.plannedTasks.length})
                    </h2>
                    <button
                      onClick={() => setModal({ type: 'addPlanned' })}
                      className="text-xs font-semibold text-[#0A84FF] flex items-center gap-1"
                    >
                      <Icons.Plus />
                      <span>Přidat úkol</span>
                    </button>
                  </div>

                  {currentCar.plannedTasks.length === 0 ? (
                    <div className="bg-[#1C1C1E] rounded-2xl p-4 border border-[#2C2C2E] text-center text-xs text-[#8E8E93]">
                      Žádné plánované opravy. Vše je hotové.
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {currentCar.plannedTasks.map(task => (
                        <div key={task.id} className="bg-[#1C1C1E] rounded-2xl p-3.5 border border-[#2C2C2E] flex items-center justify-between gap-3">
                          <div className="min-w-0 flex-1">
                            <div className="text-sm font-semibold text-white">{task.title}</div>
                            {task.note && <div className="text-xs text-[#8E8E93] mt-0.5">{task.note}</div>}
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            <button
                              onClick={() => setModal({ type: 'completePlanned', task })}
                              className="bg-[#30D158]/20 hover:bg-[#30D158]/30 active:scale-95 transition text-[#30D158] text-xs font-semibold px-3 py-1.5 rounded-xl flex items-center gap-1"
                            >
                              <Icons.Check />
                              <span>Hotovo</span>
                            </button>
                            <button
                              onClick={() => {
                                updateCurrentCar(c => ({
                                  ...c,
                                  plannedTasks: c.plannedTasks.filter(t => t.id !== task.id)
                                }));
                                showToast('Úkol smazán');
                              }}
                              className="p-1.5 text-[#8E8E93] hover:text-[#FF453A]"
                            >
                              <Icons.Trash />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>

                {/* Archiv oprav */}
                <section className="space-y-2 pt-2">
                  <div className="flex items-center justify-between px-1">
                    <div>
                      <h2 className="text-xs font-semibold uppercase tracking-wider text-[#8E8E93]">Archiv oprav</h2>
                      <div className="text-[11px] text-[#8E8E93]">
                        Letos ({new Date().getFullYear()}): <strong className="text-white">{formatNumber(currentYearSpend)} Kč</strong>
                      </div>
                    </div>
                    <button
                      onClick={() => setModal({ type: 'addArchive' })}
                      className="text-xs font-semibold text-[#0A84FF] flex items-center gap-1"
                    >
                      <Icons.Plus />
                      <span>Zapsat opravu</span>
                    </button>
                  </div>

                  {currentCar.serviceArchive.length === 0 ? (
                    <div className="bg-[#1C1C1E] rounded-2xl p-4 border border-[#2C2C2E] text-center text-xs text-[#8E8E93]">
                      Zatím žádné záznamy v archivu.
                    </div>
                  ) : (
                    <div className="space-y-2.5">
                      {[...currentCar.serviceArchive]
                        .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
                        .map(rec => (
                          <div key={rec.id} className="bg-[#1C1C1E] rounded-2xl p-3.5 border border-[#2C2C2E] space-y-1.5">
                            <div className="flex items-start justify-between gap-2">
                              <div className="text-sm font-semibold text-white">{rec.title}</div>
                              {Number(rec.price) > 0 && (
                                <span className="text-xs font-bold text-white bg-[#2C2C2E] px-2.5 py-0.5 rounded-full shrink-0">
                                  {formatNumber(rec.price)} Kč
                                </span>
                              )}
                            </div>
                            <div className="flex items-center gap-2 text-xs text-[#8E8E93]">
                              <span>{formatDateCZ(rec.date)}</span>
                              <span>•</span>
                              <span>{formatNumber(rec.km)} km</span>
                            </div>
                            {rec.note && (
                              <p className="text-xs text-white/80 bg-[#2C2C2E]/60 rounded-xl p-2.5 mt-1">
                                {rec.note}
                              </p>
                            )}
                          </div>
                        ))}
                    </div>
                  )}
                </section>
              </>
            )}
          </main>

          {/* Spodní iOS Tab Bar */}
          <nav className="fixed bottom-0 left-0 right-0 z-30 max-w-md mx-auto bg-[#1C1C1E]/90 backdrop-blur-xl border-t border-[#2C2C2E] safe-bottom px-6 pt-2 flex items-center justify-around">
            <button
              onClick={() => setActiveTab('overview')}
              className={`flex flex-col items-center gap-1 py-1 px-3 transition ${activeTab === 'overview' ? 'text-[#0A84FF]' : 'text-[#8E8E93]'}`}
            >
              <Icons.Dashboard active={activeTab === 'overview'} />
              <span className="text-[10px] font-medium">Přehled</span>
            </button>

            <button
              onClick={() => setActiveTab('docs')}
              className={`flex flex-col items-center gap-1 py-1 px-3 transition ${activeTab === 'docs' ? 'text-[#0A84FF]' : 'text-[#8E8E93]'}`}
            >
              <Icons.CarDocs active={activeTab === 'docs'} />
              <span className="text-[10px] font-medium">Auto & Doklady</span>
            </button>

            <button
              onClick={() => setActiveTab('service')}
              className={`flex flex-col items-center gap-1 py-1 px-3 transition ${activeTab === 'service' ? 'text-[#0A84FF]' : 'text-[#8E8E93]'}`}
            >
              <Icons.Wrench active={activeTab === 'service'} />
              <span className="text-[10px] font-medium">Servisní deník</span>
            </button>
          </nav>

          {/* ==================== MODÁLNÍ OKNA ==================== */}

          {/* 1. Garáž (výběr / přidání auta) */}
          <Modal isOpen={modal?.type === 'garage'} onClose={() => setModal(null)} title="Moje garáž">
            <div className="space-y-2.5">
              {cars.map(car => {
                const isSelected = car.id === currentCar.id;
                return (
                  <div
                    key={car.id}
                    onClick={() => { setActiveCarId(car.id); setModal(null); }}
                    className={`p-3.5 rounded-2xl border flex items-center justify-between cursor-pointer transition ${
                      isSelected ? 'bg-[#0A84FF]/15 border-[#0A84FF]' : 'bg-[#2C2C2E] border-transparent'
                    }`}
                  >
                    <div>
                      <div className="font-semibold text-white text-sm">{car.name}</div>
                      <div className="text-xs text-[#8E8E93]">{car.tech.spz} • {formatNumber(car.odometer)} km</div>
                    </div>
                    <div className="flex items-center gap-2">
                      {isSelected && <span className="text-[#0A84FF]"><Icons.Check /></span>}
                      {cars.length > 1 && (
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            const remaining = cars.filter(c => c.id !== car.id);
                            setCars(remaining);
                            if (isSelected) setActiveCarId(remaining[0].id);
                            showToast('Vozidlo odstraněno');
                          }}
                          className="p-1.5 text-[#8E8E93] hover:text-[#FF453A]"
                        >
                          <Icons.Trash />
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}

              <button
                onClick={() => setModal({ type: 'addCar' })}
                className="w-full py-3 rounded-2xl bg-[#0A84FF] text-white font-semibold text-sm flex items-center justify-center gap-2 mt-2 active:scale-[0.99] transition"
              >
                <Icons.Plus />
                <span>Přidat další auto</span>
              </button>
            </div>
          </Modal>

          {/* 2. Přidat nové auto */}
          <Modal isOpen={modal?.type === 'addCar'} onClose={() => setModal(null)} title="Nové auto do garáže">
            <AddCarForm
              onSave={(name, subtitle, spz, odo) => {
                const newCar = createDefaultCar(name, subtitle, spz);
                newCar.odometer = Number(odo) || 0;
                newCar.oil.lastKm = Number(odo) || 0;
                newCar.oil.lastDate = todayISO();
                setCars(prev => [...prev, newCar]);
                setActiveCarId(newCar.id);
                setModal(null);
                showToast('Auto přidáno do garáže');
              }}
            />
          </Modal>

          {/* 3. Zapsat tachometr */}
          <Modal isOpen={modal?.type === 'odometer'} onClose={() => setModal(null)} title="Aktualizovat tachometr">
            <OdometerForm
              currentKm={currentCar.odometer}
              onSave={(newKm) => {
                updateCurrentCar(c => ({
                  ...c,
                  odometer: Number(newKm),
                  odometerUpdatedAt: todayISO()
                }));
                setModal(null);
                showToast('Tachometr uložen');
              }}
            />
          </Modal>

          {/* 4. Zapsat výměnu oleje */}
          <Modal isOpen={modal?.type === 'oilChange'} onClose={() => setModal(null)} title="Zapsat výměnu oleje">
            <OilChangeForm
              currentKm={currentCar.odometer}
              defaultSpec={currentCar.tech.oilSpec}
              onSave={({ date, km, price, note }) => {
                const numericKm = Number(km);
                updateCurrentCar(c => ({
                  ...c,
                  odometer: Math.max(c.odometer, numericKm),
                  odometerUpdatedAt: date === todayISO() ? todayISO() : c.odometerUpdatedAt,
                  oil: {
                    ...c.oil,
                    lastDate: date,
                    lastKm: numericKm
                  },
                  serviceArchive: [
                    {
                      id: 'sa_' + Date.now(),
                      date,
                      title: 'Výměna motorového oleje',
                      km: numericKm,
                      price: Number(price) || 0,
                      note
                    },
                    ...c.serviceArchive
                  ]
                }));
                setModal(null);
                showToast('Výměna oleje zapsána do deníku');
              }}
            />
          </Modal>

          {/* 5. Nastavení intervalu oleje */}
          <Modal isOpen={modal?.type === 'oilSettings'} onClose={() => setModal(null)} title="Interval výměny oleje">
            <OilSettingsForm
              oil={currentCar.oil}
              onSave={(updatedOil) => {
                updateCurrentCar(c => ({ ...c, oil: { ...c.oil, ...updatedOil } }));
                setModal(null);
                showToast('Interval oleje upraven');
              }}
            />
          </Modal>

          {/* 6. Upravit technický tahák */}
          <Modal isOpen={modal?.type === 'editTech'} onClose={() => setModal(null)} title="Technický tahák">
            <TechForm
              car={currentCar}
              onSave={(carName, carSub, tech) => {
                updateCurrentCar(c => ({ ...c, name: carName, subtitle: carSub, tech }));
                setModal(null);
                showToast('Údaje uloženy');
              }}
            />
          </Modal>

          {/* 7. Upravit pneumatiky */}
          <Modal
            isOpen={modal?.type === 'editTire'}
            onClose={() => setModal(null)}
            title={modal?.season === 'summer' ? 'Letní pneumatiky' : 'Zimní pneumatiky'}
          >
            {modal?.type === 'editTire' && (
              <TireForm
                tire={currentCar.tires[modal.season]}
                onSave={(updatedTire) => {
                  updateCurrentCar(c => ({
                    ...c,
                    tires: { ...c.tires, [modal.season]: updatedTire }
                  }));
                  setModal(null);
                  showToast('Pneumatiky uloženy');
                }}
              />
            )}
          </Modal>

          {/* 8. Upravit administrativu */}
          <Modal isOpen={modal?.type === 'editAdmin'} onClose={() => setModal(null)} title={modal?.item?.title || 'Termín'}>
            {modal?.type === 'editAdmin' && (
              <AdminForm
                item={modal.item}
                onSave={(newDate) => {
                  updateCurrentCar(c => ({
                    ...c,
                    admin: c.admin.map(a => a.id === modal.item.id ? { ...a, date: newDate } : a)
                  }));
                  setModal(null);
                  showToast('Termín aktualizován');
                }}
              />
            )}
          </Modal>

          {/* 9. Upravit autobaterii */}
          <Modal isOpen={modal?.type === 'editBattery'} onClose={() => setModal(null)} title="Autobaterie">
            <BatteryForm
              battery={currentCar.components.battery}
              onSave={(bat) => {
                updateCurrentCar(c => ({
                  ...c,
                  components: { ...c.components, battery: bat }
                }));
                setModal(null);
                showToast('Autobaterie aktualizována');
              }}
            />
          </Modal>

          {/* 10. Upravit rozvody */}
          <Modal isOpen={modal?.type === 'editTimingBelt'} onClose={() => setModal(null)} title="Rozvody motoru">
            <TimingBeltForm
              timingBelt={currentCar.components.timingBelt}
              onSave={(tb) => {
                updateCurrentCar(c => ({
                  ...c,
                  components: { ...c.components, timingBelt: tb }
                }));
                setModal(null);
                showToast('Rozvody aktualizovány');
              }}
            />
          </Modal>

          {/* 11. Přidat plánovaný úkol */}
          <Modal isOpen={modal?.type === 'addPlanned'} onClose={() => setModal(null)} title="Nový plánovaný úkol">
            <PlannedForm
              onSave={(title, note) => {
                updateCurrentCar(c => ({
                  ...c,
                  plannedTasks: [{ id: 'pt_' + Date.now(), title, note }, ...c.plannedTasks]
                }));
                setModal(null);
                showToast('Přidáno do plánu');
              }}
            />
          </Modal>

          {/* 12. Dokončit plánovaný úkol -> přesun do archivu */}
          <Modal isOpen={modal?.type === 'completePlanned'} onClose={() => setModal(null)} title="Dokončit a přesunout do archivu">
            {modal?.type === 'completePlanned' && (
              <ArchiveForm
                initialTitle={modal.task.title}
                initialNote={modal.task.note}
                currentKm={currentCar.odometer}
                onSave={({ title, date, km, price, note }) => {
                  updateCurrentCar(c => ({
                    ...c,
                    plannedTasks: c.plannedTasks.filter(t => t.id !== modal.task.id),
                    serviceArchive: [
                      { id: 'sa_' + Date.now(), title, date, km: Number(km), price: Number(price) || 0, note },
                      ...c.serviceArchive
                    ]
                  }));
                  setModal(null);
                  showToast('Přesunuto do archivu oprav');
                }}
              />
            )}
          </Modal>

          {/* 13. Přidat záznam přímo do archivu */}
          <Modal isOpen={modal?.type === 'addArchive'} onClose={() => setModal(null)} title="Zapsat opravu do archivu">
            <ArchiveForm
              currentKm={currentCar.odometer}
              onSave={({ title, date, km, price, note }) => {
                updateCurrentCar(c => ({
                  ...c,
                  serviceArchive: [
                    { id: 'sa_' + Date.now(), title, date, km: Number(km), price: Number(price) || 0, note },
                    ...c.serviceArchive
                  ]
                }));
                setModal(null);
                showToast('Záznam uložen');
              }}
            />
          </Modal>

          {/* 14. Nastavení & Záloha */}
          <Modal isOpen={modal?.type === 'settings'} onClose={() => setModal(null)} title="Záloha a nastavení">
            <SettingsPanel
              onExport={handleExportJSON}
              onImport={handleImportJSON}
              onReset={() => {
                const def = [createDefaultCar('Škoda Octavia', '2.0 TDI • Combi', '4A2 8890')];
                setCars(def);
                setActiveCarId(def[0].id);
                setModal(null);
                showToast('Obnovena výchozí data');
              }}
            />
          </Modal>
        </div>
      );
    }

    // --- Formuláře uvnitř modálních oken ---
    const inputClass = "w-full bg-[#2C2C2E] border border-[#38383A] rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:border-[#0A84FF]";
    const labelClass = "block text-xs font-medium text-[#8E8E93] mb-1";
    const btnPrimary = "w-full py-3 rounded-xl bg-[#0A84FF] text-white font-semibold text-sm active:scale-[0.99] transition mt-2";

    function AddCarForm({ onSave }) {
      const [name, setName] = useState('');
      const [subtitle, setSubtitle] = useState('');
      const [spz, setSpz] = useState('');
      const [odo, setOdo] = useState('');
      return (
        <form onSubmit={(e) => { e.preventDefault(); if (name.trim()) onSave(name.trim(), subtitle.trim(), spz.trim(), odo); }} className="space-y-3">
          <div>
            <label className={labelClass}>Název auta *</label>
            <input required placeholder="Např. VW Golf VII" value={name} onChange={e => setName(e.target.value)} className={inputClass} />
          </div>
          <div className="grid grid-cols-2 gap-2.5">
            <div>
              <label className={labelClass}>SPZ</label>
              <input placeholder="1AB 2345" value={spz} onChange={e => setSpz(e.target.value)} className={inputClass} />
            </div>
            <div>
              <label className={labelClass}>Aktuální km</label>
              <input type="number" inputMode="numeric" placeholder="120000" value={odo} onChange={e => setOdo(e.target.value)} className={inputClass} />
            </div>
          </div>
          <button type="submit" className={btnPrimary}>Přidat do garáže</button>
        </form>
      );
    }

    function OdometerForm({ currentKm, onSave }) {
      const [km, setKm] = useState(String(currentKm));
      return (
        <form onSubmit={(e) => { e.preventDefault(); if (km !== '') onSave(km); }} className="space-y-3">
          <div>
            <label className={labelClass}>Aktuální stav tachometru (km)</label>
            <input
              type="number"
              inputMode="numeric"
              required
              autoFocus
              value={km}
              onChange={e => setKm(e.target.value)}
              className="w-full bg-[#2C2C2E] border border-[#38383A] rounded-xl px-4 py-3 text-white text-2xl font-bold focus:outline-none focus:border-[#0A84FF]"
            />
          </div>
          <button type="submit" className={btnPrimary}>Uložit stav km</button>
        </form>
      );
    }

    function OilChangeForm({ currentKm, defaultSpec, onSave }) {
      const [date, setDate] = useState(todayISO());
      const [km, setKm] = useState(String(currentKm));
      const [price, setPrice] = useState('');
      const [note, setNote] = useState(defaultSpec || '');
      return (
        <form onSubmit={(e) => { e.preventDefault(); onSave({ date, km, price, note }); }} className="space-y-3">
          <div className="grid grid-cols-2 gap-2.5">
            <div>
              <label className={labelClass}>Datum výměny</label>
              <input type="date" required value={date} onChange={e => setDate(e.target.value)} className={inputClass} />
            </div>
            <div>
              <label className={labelClass}>Stav km</label>
              <input type="number" inputMode="numeric" required value={km} onChange={e => setKm(e.target.value)} className={inputClass} />
            </div>
          </div>
          <div>
            <label className={labelClass}>Cena (Kč – volitelné)</label>
            <input type="number" inputMode="numeric" placeholder="Např. 3500" value={price} onChange={e => setPrice(e.target.value)} className={inputClass} />
          </div>
          <div>
            <label className={labelClass}>Poznámka (použitý olej / filtry)</label>
            <input placeholder="Např. 5W-30 + olejový filtr" value={note} onChange={e => setNote(e.target.value)} className={inputClass} />
          </div>
          <button type="submit" className={btnPrimary}>Potvrdit výměnu a uložit do deníku</button>
        </form>
      );
    }

    function OilSettingsForm({ oil, onSave }) {
      const [lastDate, setLastDate] = useState(oil.lastDate);
      const [lastKm, setLastKm] = useState(String(oil.lastKm));
      const [intervalKm, setIntervalKm] = useState(String(oil.intervalKm));
      const [intervalDays, setIntervalDays] = useState(String(oil.intervalDays));
      return (
        <form onSubmit={(e) => {
          e.preventDefault();
          onSave({
            lastDate,
            lastKm: Number(lastKm),
            intervalKm: Number(intervalKm) || 15000,
            intervalDays: Number(intervalDays) || 365
          });
        }} className="space-y-3">
          <div className="grid grid-cols-2 gap-2.5">
            <div>
              <label className={labelClass}>Poslední výměna (datum)</label>
              <input type="date" required value={lastDate} onChange={e => setLastDate(e.target.value)} className={inputClass} />
            </div>
            <div>
              <label className={labelClass}>Poslední výměna (km)</label>
              <input type="number" inputMode="numeric" required value={lastKm} onChange={e => setLastKm(e.target.value)} className={inputClass} />
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2.5">
            <div>
              <label className={labelClass}>Interval (km)</label>
              <input type="number" inputMode="numeric" required value={intervalKm} onChange={e => setIntervalKm(e.target.value)} className={inputClass} />
            </div>
            <div>
              <label className={labelClass}>Interval (dny)</label>
              <input type="number" inputMode="numeric" required value={intervalDays} onChange={e => setIntervalDays(e.target.value)} className={inputClass} />
            </div>
          </div>
          <button type="submit" className={btnPrimary}>Uložit nastavení oleje</button>
        </form>
      );
    }

    function TechForm({ car, onSave }) {
      const [name, setName] = useState(car.name);
      const [vin, setVin] = useState(car.tech.vin);
      const [spz, setSpz] = useState(car.tech.spz);
      const [oilSpec, setOilSpec] = useState(car.tech.oilSpec);
      const [tirePressure, setTirePressure] = useState(car.tech.tirePressure);
      const [wipers, setWipers] = useState(car.tech.wipers);
      const [assistancePhone, setAssistancePhone] = useState(car.tech.assistancePhone);

      return (
        <form onSubmit={(e) => {
          e.preventDefault();
          onSave(name, car.subtitle, { vin, spz, oilSpec, tirePressure, wipers, assistancePhone });
        }} className="space-y-2.5">
          <div>
            <label className={labelClass}>Název vozu</label>
            <input required value={name} onChange={e => setName(e.target.value)} className={inputClass} />
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className={labelClass}>SPZ</label>
              <input value={spz} onChange={e => setSpz(e.target.value)} className={inputClass} />
            </div>
            <div>
              <label className={labelClass}>Asistence (telefon)</label>
              <input type="tel" value={assistancePhone} onChange={e => setAssistancePhone(e.target.value)} className={inputClass} />
            </div>
          </div>
          <div>
            <label className={labelClass}>VIN kód</label>
            <input value={vin} onChange={e => setVin(e.target.value.toUpperCase())} className={`${inputClass} font-mono`} />
          </div>
          <div>
            <label className={labelClass}>Specifikace oleje</label>
            <input value={oilSpec} onChange={e => setOilSpec(e.target.value)} className={inputClass} />
          </div>
          <div>
            <label className={labelClass}>Tlak v pneumatikách</label>
            <input value={tirePressure} onChange={e => setTirePressure(e.target.value)} className={inputClass} />
          </div>
          <div>
            <label className={labelClass}>Rozměr stěračů</label>
            <input value={wipers} onChange={e => setWipers(e.target.value)} className={inputClass} />
          </div>
          <button type="submit" className={btnPrimary}>Uložit tahák</button>
        </form>
      );
    }

    function TireForm({ tire, onSave }) {
      const [size, setSize] = useState(tire.size);
      const [brand, setBrand] = useState(tire.brand);
      const [dotYear, setDotYear] = useState(String(tire.dotYear));
      return (
        <form onSubmit={(e) => { e.preventDefault(); onSave({ size, brand, dotYear: Number(dotYear) }); }} className="space-y-3">
          <div>
            <label className={labelClass}>Rozměr a indexy (pro objednání nových)</label>
            <input required placeholder="Např. 225/45 R17 91Y" value={size} onChange={e => setSize(e.target.value)} className={inputClass} />
          </div>
          <div>
            <label className={labelClass}>Značka a model</label>
            <input placeholder="Např. Michelin Primacy 4" value={brand} onChange={e => setBrand(e.target.value)} className={inputClass} />
          </div>
          <div>
            <label className={labelClass}>Rok výroby (DOT)</label>
            <input type="number" inputMode="numeric" required placeholder="2023" value={dotYear} onChange={e => setDotYear(e.target.value)} className={inputClass} />
          </div>
          <button type="submit" className={btnPrimary}>Uložit sadu pneu</button>
        </form>
      );
    }

    function AdminForm({ item, onSave }) {
      const [date, setDate] = useState(item.date || '');
      return (
        <form onSubmit={(e) => { e.preventDefault(); onSave(date); }} className="space-y-3">
          <div>
            <label className={labelClass}>Datum konce platnosti</label>
            <input type="date" required value={date} onChange={e => setDate(e.target.value)} className={inputClass} />
          </div>
          <button type="submit" className={btnPrimary}>Uložit termín</button>
        </form>
      );
    }

    function BatteryForm({ battery, onSave }) {
      const [installDate, setInstallDate] = useState(battery.installDate);
      const [lifespanYears, setLifespanYears] = useState(String(battery.lifespanYears || 5));
      return (
        <form onSubmit={(e) => { e.preventDefault(); onSave({ installDate, lifespanYears: Number(lifespanYears) || 5 }); }} className="space-y-3">
          <div>
            <label className={labelClass}>Datum pořízení / instalace baterie</label>
            <input type="date" required value={installDate} onChange={e => setInstallDate(e.target.value)} className={inputClass} />
          </div>
          <div>
            <label className={labelClass}>Očekávaná životnost (let)</label>
            <input type="number" inputMode="numeric" required value={lifespanYears} onChange={e => setLifespanYears(e.target.value)} className={inputClass} />
          </div>
          <button type="submit" className={btnPrimary}>Uložit baterii</button>
        </form>
      );
    }

    function TimingBeltForm({ timingBelt, onSave }) {
      const [lastDate, setLastDate] = useState(timingBelt.lastDate);
      const [lastKm, setLastKm] = useState(String(timingBelt.lastKm));
      const [intervalKm, setIntervalKm] = useState(String(timingBelt.intervalKm));
      const [intervalYears, setIntervalYears] = useState(String(timingBelt.intervalYears));
      return (
        <form onSubmit={(e) => {
          e.preventDefault();
          onSave({
            lastDate,
            lastKm: Number(lastKm),
            intervalKm: Number(intervalKm) || 150000,
            intervalYears: Number(intervalYears) || 6
          });
        }} className="space-y-3">
          <div className="grid grid-cols-2 gap-2.5">
            <div>
              <label className={labelClass}>Datum poslední výměny</label>
              <input type="date" required value={lastDate} onChange={e => setLastDate(e.target.value)} className={inputClass} />
            </div>
            <div>
              <label className={labelClass}>Stav km při výměně</label>
              <input type="number" inputMode="numeric" required value={lastKm} onChange={e => setLastKm(e.target.value)} className={inputClass} />
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2.5">
            <div>
              <label className={labelClass}>Interval (km)</label>
              <input type="number" inputMode="numeric" required value={intervalKm} onChange={e => setIntervalKm(e.target.value)} className={inputClass} />
            </div>
            <div>
              <label className={labelClass}>Interval (let)</label>
              <input type="number" inputMode="numeric" required value={intervalYears} onChange={e => setIntervalYears(e.target.value)} className={inputClass} />
            </div>
          </div>
          <button type="submit" className={btnPrimary}>Uložit rozvody</button>
        </form>
      );
    }

    function PlannedForm({ onSave }) {
      const [title, setTitle] = useState('');
      const [note, setNote] = useState('');
      return (
        <form onSubmit={(e) => { e.preventDefault(); if (title.trim()) onSave(title.trim(), note.trim()); }} className="space-y-3">
          <div>
            <label className={labelClass}>Co je potřeba udělat *</label>
            <input required autoFocus placeholder="Např. Vyměnit zadní brzdové destičky" value={title} onChange={e => setTitle(e.target.value)} className={inputClass} />
          </div>
          <div>
            <label className={labelClass}>Poznámka (volitelné)</label>
            <input placeholder="Např. Koupit značku ATE" value={note} onChange={e => setNote(e.target.value)} className={inputClass} />
          </div>
          <button type="submit" className={btnPrimary}>Přidat do plánu</button>
        </form>
      );
    }

    function ArchiveForm({ initialTitle = '', initialNote = '', currentKm, onSave }) {
      const [title, setTitle] = useState(initialTitle);
      const [date, setDate] = useState(todayISO());
      const [km, setKm] = useState(String(currentKm));
      const [price, setPrice] = useState('');
      const [note, setNote] = useState(initialNote);
      return (
        <form onSubmit={(e) => { e.preventDefault(); if (title.trim()) onSave({ title: title.trim(), date, km, price, note: note.trim() }); }} className="space-y-3">
          <div>
            <label className={labelClass}>Provedený úkon *</label>
            <input required placeholder="Např. Výměna brzdových destiček" value={title} onChange={e => setTitle(e.target.value)} className={inputClass} />
          </div>
          <div className="grid grid-cols-2 gap-2.5">
            <div>
              <label className={labelClass}>Datum</label>
              <input type="date" required value={date} onChange={e => setDate(e.target.value)} className={inputClass} />
            </div>
            <div>
              <label className={labelClass}>Stav km</label>
              <input type="number" inputMode="numeric" required value={km} onChange={e => setKm(e.target.value)} className={inputClass} />
            </div>
          </div>
          <div>
            <label className={labelClass}>Cena (Kč)</label>
            <input type="number" inputMode="numeric" placeholder="0" value={price} onChange={e => setPrice(e.target.value)} className={inputClass} />
          </div>
          <div>
            <label className={labelClass}>Poznámka (díly, servis)</label>
            <input placeholder="Např. Přední kotouče + desky Brembo" value={note} onChange={e => setNote(e.target.value)} className={inputClass} />
          </div>
          <button type="submit" className={btnPrimary}>Uložit do archivu</button>
        </form>
      );
    }

    function SettingsPanel({ onExport, onImport, onReset }) {
      const [confirmReset, setConfirmReset] = useState(false);
      const fileInputRef = useRef(null);

      return (
        <div className="space-y-3">
          <div className="bg-[#2C2C2E]/70 rounded-2xl p-3.5 text-xs text-[#8E8E93] space-y-1">
            <div className="text-white font-semibold text-sm flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-[#30D158]"></span>
              <span>Offline paměť iPhonu je aktivní</span>
            </div>
            <p>Všechny změny se okamžitě ukládají přímo do telefonu. Pro jistotu při změně mobilu si můžeš kdykoliv stáhnout zálohu na iCloud Drive.</p>
          </div>

          <button
            onClick={onExport}
            className="w-full py-3 rounded-xl bg-[#0A84FF] text-white font-semibold text-sm active:scale-[0.99] transition"
          >
            Stáhnout zálohu (.json) na iCloud
          </button>

          <button
            onClick={() => fileInputRef.current?.click()}
            className="w-full py-3 rounded-xl bg-[#2C2C2E] text-white font-semibold text-sm active:scale-[0.99] transition"
          >
            Obnovit data ze zálohy (.json)
          </button>
          <input ref={fileInputRef} type="file" accept=".json,application/json" onChange={onImport} className="hidden" />

          <div className="pt-2 border-t border-[#2C2C2E]">
            {!confirmReset ? (
              <button
                onClick={() => setConfirmReset(true)}
                className="w-full py-2.5 rounded-xl text-xs font-medium text-[#FF453A] hover:bg-[#FF453A]/10 transition"
              >
                Resetovat aplikaci do výchozího stavu
              </button>
            ) : (
              <div className="space-y-2">
                <p className="text-xs text-center text-[#FF453A]">Opravdu smazat všechna uložená auta a záznamy?</p>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => setConfirmReset(false)} className="py-2 rounded-xl bg-[#2C2C2E] text-xs font-semibold">Zrušit</button>
                  <button onClick={onReset} className="py-2 rounded-xl bg-[#FF453A] text-white text-xs font-semibold">Ano, smazat</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
